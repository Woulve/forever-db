# Builds the WoW Forever master database and every slice.
# Runs daily, when new recordings are pushed to the addon repo (repository_dispatch), or by hand.
# Only when the data actually changed: commits the ForeverDB addon folder, tags it,
# uploads it to CurseForge (project 1807282) and refreshes the "latest" GitHub release.
name: Build database

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Release even if the data didn't change"
        type: boolean
        default: false
  repository_dispatch:
    types: [new-recordings]

permissions:
  contents: write

concurrency:
  group: build-db
  cancel-in-progress: false

env:
  BASE_REPO: https://github.com/cmangos/classic-db.git
  ADDON_REPO: ${{ vars.ADDON_REPO }}          # e.g. yourname/CommandCenter (holds collected/)
  CF_PROJECT: "1807282"                       # CurseForge project of the ForeverDB addon

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1 >/dev/null
          python tests/run_tests.py

      - name: Get the open vanilla database
        run: |
          git clone --depth 1 "$BASE_REPO" base-src
          echo "BASE_SHA=$(git -C base-src rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Cache base import
        id: cache
        uses: actions/cache@v4
        with:
          path: work/base.json
          key: base-${{ env.BASE_SHA }}-${{ hashFiles('tools/import_base.py', 'tools/sqldump.py') }}

      - name: Import base
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p work
          # the full world dump lives in Full_DB/ (zip / sql / sql.gz); fall back to the whole repo
          if [ -d base-src/Full_DB ]; then SRC=base-src/Full_DB; else SRC=base-src; fi
          python tools/import_base.py "$SRC" work/base.json

      - name: Get recordings from the addon repo
        if: env.ADDON_REPO != ''
        env:
          TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          git clone --depth 1 --filter=blob:none --sparse "https://x-access-token:${TOKEN}@github.com/${ADDON_REPO}.git" addon-src
          git -C addon-src sparse-checkout set collected
          mkdir -p addon-src/collected

      - name: Build master
        run: |
          mkdir -p dist
          mkdir -p addon-src/collected
          python tools/build.py --base work/base.json --collected collected addon-src/collected --out dist/forever.json

      - name: Changed?
        id: diff
        run: |
          NEW=$(python -c "import json;print(json.load(open('dist/forever.json'))['meta']['hash'])")
          OLD=$(python -c "import json,os;print(json.load(open('manifest.json'))['hash'] if os.path.exists('manifest.json') else '')")
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$NEW" = "$OLD" ] && [ "${{ inputs.force }}" != "true" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Slices
        if: steps.diff.outputs.changed == 'true'
        run: |
          for spec in slices/*.json; do
            name=$(basename "$spec" .json)
            target=$(python -c "import json;print(json.load(open('$spec')).get('target','$name'))")
            mkdir -p "out/$name/$target"
            toc=$(python -c "import json;print(json.load(open('$spec')).get('toc',''))")
            if [ -f "slices/$name.toc" ] && [ -n "$toc" ]; then cp "slices/$name.toc" "out/$name/$target/$toc"; fi
            python tools/slice.py "$spec" dist/forever.json "out/$name/$target"
            cp LICENSE-DATA.txt "out/$name/$target/"
            for lic in LICENSE.md LICENSE COPYING; do if [ -f "base-src/$lic" ]; then cp "base-src/$lic" "out/$name/$target/LICENSE-GPL.txt"; break; fi; done
            (cd "out/$name" && zip -qr "../../dist/$name.zip" "$target")
          done
          gzip -kf dist/forever.json

      - name: Publish
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          m = json.load(open("dist/forever.json"))["meta"]
          json.dump(m, open("manifest.json", "w"), indent=1, sort_keys=True)
          PY
          # the ForeverDB addon folder lives in the repo so the CurseForge packager can ship it
          rm -rf ForeverDB
          cp -r out/forever/ForeverDB ForeverDB
          VERSION="$(date -u +%Y.%m.%d).${{ github.run_number }}"
          sed -i "s/^## Version:.*/## Version: $VERSION/" ForeverDB/ForeverDB.toc
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git config user.name "forever-db bot"
          git config user.email "actions@users.noreply.github.com"
          git add manifest.json ForeverDB
          git commit -m "ForeverDB $VERSION (data ${{ steps.diff.outputs.new }})" || true
          git tag "v$VERSION"
          git push origin HEAD "v$VERSION"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/forever.json.gz dist/*.zip --title "Forever database (latest)" --notes "ForeverDB $VERSION, built $(date -u +%F) from base ${BASE_SHA} + recordings. Hash ${{ steps.diff.outputs.new }}."

      - name: Upload ForeverDB to CurseForge
        if: steps.diff.outputs.changed == 'true'
        uses: BigWigsMods/packager@v2
        with:
          args: -p ${{ env.CF_PROJECT }}
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}

      - name: Tell other repos
        if: steps.diff.outputs.changed == 'true' && vars.DB_CONSUMERS != ''
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
        run: |
          # repos that want a ping when the data changes: DB_CONSUMERS variable (space separated owner/repo)
          for r in ${{ vars.DB_CONSUMERS }}; do gh api "repos/$r/dispatches" -f event_type=db-updated -f "client_payload[version]=$VERSION" || true; done
